name: Build and Deploy Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Release (version bump + changelog)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Deploy
        run: |
          for i in 1 2 3; do
            docker compose pull && break
            echo "Pull failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          docker compose up -d --force-recreate
