name: Build and Deploy Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. 1.0.0). Leave blank for latest.'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Release (version bump + changelog)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Deploy
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
        run: |
          echo "Deploying image tag: $IMAGE_TAG"
          set +e
          pulled=1
          for i in 1 2 3; do
            docker compose pull 2>&1 | tee -a /home/acap/last-portfolio-deploy.log
            if [ ${PIPESTATUS[0]} -eq 0 ]; then
              pulled=0
              break
            fi
            echo "Pull failed (attempt $i/3), retrying in 5s..." | tee -a /home/acap/last-portfolio-deploy.log
            sleep 5
          done
          set -e
          if [ "$pulled" -ne 0 ]; then
            echo "::error::docker compose pull failed after 3 attempts"
            exit 1
          fi
          docker compose up -d --force-recreate
